<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richard Huynh — Product Designer</title>

  <!-- Google Fonts: Yantramanav -->
  <link href="https://fonts.googleapis.com/css2?family=Yantramanav:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- Hero: each child gets animate + stagger delay -->
    <main class="hero">
      <img
        class="hero__logo animate animate-delay-1"
        src="Logo.png"
        alt="Richard Huynh logo"
      />
      <div class="hero__identity animate animate-delay-2">
        <span class="hero__name">Richard Huynh</span>
        <span class="hero__title">Product Designer</span>
      </div>
      <p class="hero__bio animate animate-delay-3">
        Richard [ˈrɪtʃərd] n. A human-focused designer dedicated to crafting
        products that make complex digital experiences feel effortless
      </p>
    </main>

    <!-- Copyright — fixed bottom right -->
    <footer class="footer animate animate-delay-4">
      <span class="footer__copyright">© 2026</span>
    </footer>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item nav-item--active" aria-label="Home">
        <span class="material-icons">home</span>
      </a>
      <a href="about.html" class="nav-item" aria-label="About">
        <span class="material-icons">person_outline</span>
      </a>
      <a href="work.html" class="nav-item" aria-label="Work">
        <span class="material-icons">work_outline</span>
      </a>
      <a href="resume.html" class="nav-item" aria-label="Resume">
        <span class="material-icons">description</span>
      </a>
    </nav>

  </div>

  <!-- Animation script -->
  <script src="animate.js"></script>
</body>
</html>
